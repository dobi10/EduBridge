<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CodeSphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="auth-header">
    <a href="index.html" class="logo">CodeSphere</a>
</header>

<main class="auth-container">

    <div class="auth-card">

        <h1>Welcome Back 👋</h1>

        <p>Log in to continue learning.</p>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                id="loginBtn">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p class="auth-link">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </p>

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</main>

<script
    type="module"
    src="login.js">
</script>

</body>
</html>
