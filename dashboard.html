<!DOCTYPE html>
<html>

<head>
<title>Dashboard - CodeSphere</title>
<link rel="stylesheet" href="style.css">
</head>

<body>


<header>
<div class="logo">CodeSphere</div>
</header>



<section class="dashboard">

<h1>Welcome, Student 👋</h1>


<div class="stats">


<div class="stats">

<div class="box">
<h2 id="coursesStarted">0</h2>
<p>Courses Started</p>
</div>


<div class="box">
<h2 id="completed">0</h2>
<p>Lessons Completed</p>
</div>


<div class="box">
<h2 id="xp">0</h2>
<p>XP Points</p>
</div>


<div class="box">
<h2 id="level">1</h2>
<p>Level</p>
</div>


</div>



<h2>Your Courses</h2>


<div class="course-progress">


<div>
<h3>HTML</h3>

<div class="bar">
<div class="fill"></div>
</div>

<p>40% Complete</p>

</div>



<div>

<h3>Python</h3>

<div class="bar">
<div class="fill python"></div>
</div>

<p>20% Complete</p>

</div>


</div>



<button>
View Certificates
</button>


</section>
  <script type="module" src="dashboard.js"></script>


</body>
  </html>
