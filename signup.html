<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CodeSphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="auth-header">

    <a href="index.html" class="logo">
        CodeSphere
    </a>

</header>


<main class="auth-container">

    <div class="auth-card">

        <h1>Create Account 🚀</h1>

        <p>
            Start your coding journey for free.
        </p>


        <form id="signupForm">

            <label for="name">
                Full Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="6"
                required
            >


            <button
                type="submit"
                id="signupBtn">

                Create Account

            </button>

        </form>


        <p id="signupMessage"></p>


        <p class="auth-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</main>


<script
    type="module"
    src="signup.js">
</script>

</body>

</html>
