<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - CodeSphere</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1>Join CodeSphere 🚀</h1>

            <p>Start learning programming for free.</p>

            <form id="signupForm">

                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >


                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="signupMessage"></p>


            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

            <a href="index.html">
                ← Back to CodeSphere
            </a>

        </div>

    </main>


    <script
        type="module"
        src="signup.js">
    </script>

</body>

                  </html>
