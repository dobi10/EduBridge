<section class="admin">


<h1>Admin Dashboard</h1>



<div class="admin-cards">


<div class="box">

<h2>250</h2>
<p>Students</p>

</div>


<div class="box">

<h2>50</h2>
<p>Courses</p>

</div>



<div class="box">

<h2>1000+</h2>
<p>Lessons</p>

</div>


</div>




<h2>Add New Course</h2>
  <section class="announcement">

<h2>Create Announcement</h2>

<input 
id="noticeTitle"
placeholder="Title">


<textarea 
id="noticeMessage"
placeholder="Message">
</textarea>


<button id="sendNotice">
Send Announcement
</button>

  </section>


<input 
placeholder="Course Name"
id="courseName"
>


<textarea 
placeholder="Course Description"
id="description">
</textarea>


<button onclick="addCourse()">
Add Course
</button>



<div id="message"></div>
  <section class="add-course">

<h2>Add New Course</h2>

<input id="courseTitle" placeholder="Course Title">

<textarea id="courseDescription"
placeholder="Course Description"></textarea>

<select id="courseLevel">
<option>Beginner</option>
<option>Intermediate</option>
<option>Advanced</option>
</select>

<select id="courseCategory">
<option>Web Development</option>
<option>Programming</option>
<option>Mobile</option>
<option>Database</option>
<option>Cybersecurity</option>
<option>AI</option>
</select>

<input type="file" id="courseImage">

<button id="publishCourse">
Publish Course
</button>

  </section>


</section>
  <input id="courseID"
placeholder="Course ID">


<textarea id="question"
placeholder="Question">
</textarea>


<input id="answer"
placeholder="Correct answer">


<button id="addQuiz">
Add Quiz
</button>


<script type="module" src="admin-quiz.js"></script>



<script src="admin.js"></script>
